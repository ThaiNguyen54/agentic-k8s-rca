apiVersion: v1
kind: Namespace
metadata:
  name: webhook-receiver-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webhook-receiver
  namespace: webhook-receiver-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-receiver
  namespace: webhook-receiver-system
  labels:
    app: webhook-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-receiver
  template:
    metadata:
      labels:
        app: webhook-receiver
    spec:
      serviceAccountName: webhook-receiver
      containers:
      - name: webhook-receiver
        image: thainguyen13099/webhook-receiver:latest
        ports:
        - containerPort: 9093
          name: webhook
        env:
        - name: KAGENT_URL
          value: "http://kagent-controller.kagent.svc.cluster.local:8083"
        - name: RCA_AGENT_NAME
          value: "k8s-agent"
        - name: RCA_AGENT_NAMESPACE
          value: "kagent"
        - name: PORT
          value: "9093"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9093
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 9093
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-receiver-svc
  namespace: webhook-receiver-system
spec:
  selector:
    app: webhook-receiver
  ports:
  - name: webhook
    port: 9093
    targetPort: 9093
