# Lets the failover MCP server read the ClusterPolicy CRD schema (get on that one
# CRD only). Without it the validator's required get_clusterpolicy_schema call
# fails with Forbidden and the validator rejects every hypothesis.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: failover-mcp-read-clusterpolicy-crd
rules:
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  resourceNames: ["clusterpolicies.transition.dcnlab.ssu.ac.kr"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: failover-mcp-read-clusterpolicy-crd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: failover-mcp-read-clusterpolicy-crd
subjects:
- kind: ServiceAccount
  name: failover-mcp-server
  namespace: kagent
